# AFETCH.DMD: the module itself, a `no_std`, `no_main` program linked with Desk's `module.ld` and packed by `dmdpack`.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "afetch-dmd"
description = "AFETCH.DMD: afterfetch as a Desk module, printing through desk_log"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
hosted = ["afterfetch-desk/hosted"]

[dependencies]
afterfetch-desk = { path = ".." }
desk-guest = { path = "../vendor/module/guest" }

[[bin]]
name = "afetch"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true
