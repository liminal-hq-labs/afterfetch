# The Afterglow Dusk palette for afterfetch: every tone a logo may use, and the colour it takes at each depth.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Masters fill only with a tone's `rgb`. The generator (art/scripts/afterfetch_art.py) writes every column below into
# crates/afterfetch-art/src/generated/palette.rs. docs/art.md explains the choices; the numbers here are the truth.
#
# Columns of a tone:
#   id         stable number, 1 to 15 (0 is transparent); never reused or renumbered
#   letter     the tone's letter in art/ascii/*.txt tone rows
#   rgb        the design colour, used at truecolour and in masters
#   xterm256   the xterm-256 index used at 256 colours (16 to 255 only, never the user-themed 0 to 15)
#   console16  the console attribute index (Win32 consoles, DOS, Windows 3.1 at 16 colours): 0 black, 1 blue, 2 green,
#              3 cyan, 4 red, 5 magenta, 6 brown/yellow, 7 grey, 8 to 15 bright. Absent: drawn transparent at 16 and in mono
#   ansi16     the SGR index at 16 colours (30 to 37 and 90 to 97 count from it); always console16 with bits 0 and 2 swapped
#   mono       bright, normal or dim: bold, plain and faint on Unix; the intensity bit on DOS and MDA. Absent: not drawn
#   delta-e    CIE76 distance (Lab, D65) from `rgb` to what each depth shows: the xterm256 entry; the console16 entry in
#              the Dusk console table, the Afterglow terminal ANSI table and the stock Windows and VGA tables
#   contrast   WCAG contrast of `rgb` on the Dusk console background (navy) and on black

[source]
repository = "liminal-hq/afterglow-themes"
commit = "84a8d5c"
console-table = "desktop/schemes/dusk.reg, desktop/install/afterglow-original.reg (HKCU\\Console ColorTable00 to 15)"
brand = "scripts/palette.mjs (brand), liminalhq.ca tokens --brand-gold, --orange-200, --red-100, --red-200"
terminal = "vscode/themes/afterglow-color-theme.json (terminal.ansi*)"
reactos-liminal = "tools/afterfetch/src/palette.rs at d6c72ae: Tone::index, held by a test against the console16 column"

# The 16 colours the ReactOS image writes to HKCU\Console, in console index order. ColorTable values are COLORREF
# (0x00BBGGRR), so ColorTable14 = 0x008ed0ff is #ffd08e.
[tables]
dusk-console = [
	"#0a1230", "#7f95f2", "#86cf9a", "#62c6d6", "#f43f5e", "#c98be6", "#ffaa40", "#e9e2d8",
	"#7c8796", "#a9b8ff", "#b0efc0", "#98e6f0", "#f995a6", "#e4b8f8", "#ffd08e", "#fff7ea",
]
# The Afterglow terminal palette (VS Code and Claude Code themes), in ANSI index order.
afterglow-terminal = [
	"#333847", "#f43f5e", "#2ec66a", "#fbbf24", "#60a5fa", "#a78bfa", "#22d3ee", "#b4bfce",
	"#5a6273", "#f995a6", "#8ce0ad", "#fddc87", "#a8cefc", "#cfbffc", "#85e7f6", "#f4f4f8",
]
# Stock tables, for the ΔE notes only: the legacy Windows console and the IBM VGA text palette, both in console order.
stock-console = [
	"#000000", "#000080", "#008000", "#008080", "#800000", "#800080", "#808000", "#c0c0c0",
	"#808080", "#0000ff", "#00ff00", "#00ffff", "#ff0000", "#ff00ff", "#ffff00", "#ffffff",
]
stock-vga = [
	"#000000", "#0000aa", "#00aa00", "#00aaaa", "#aa0000", "#aa00aa", "#aa5500", "#aaaaaa",
	"#555555", "#5555ff", "#55ff55", "#55ffff", "#ff5555", "#ff55ff", "#ffff55", "#ffffff",
]
# What mono levels look like in review sheets (not used at run time).
mono-preview = { bright = "#ffffff", normal = "#aaaaaa", dim = "#5c5c5c" }

# The title rule's tone per architecture (AF-D17): the architecture is text plus this accent.
[arch-accent]
x86 = "gold"
x86_64 = "gold"
arm = "periwinkle"
aarch64 = "periwinkle"
mips = "violet"
riscv64 = "teal"
powerpc64 = "lilac"
other = "slate"

[[tone]]
id = 1
name = "gold"
letter = "g"
rgb = "#ffd08e"
xterm256 = 222
console16 = 14
ansi16 = 11
mono = "bright"
role = "The sun's crown; the first fact label."
source = "brand --brand-gold; console ColorTable14"
delta-e = { xterm256 = 7.2, dusk-console = 0.0, afterglow-terminal = 10.6, stock-console = 64.0, stock-vga = 48.6 }
contrast = { navy = 12.8, black = 14.7 }

