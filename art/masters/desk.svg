<!--
desk logo master: the banded Afterglow sun on Desk's Void wearing its stepped halo, over its stepped Horizon, for Desk

(c) Copyright 2026 Liminal HQ, Scott Morris
SPDX-License-Identifier: Apache-2.0 OR MIT

Grid: 36 x 24 logo pixels (36 columns x 12 rows of half-block cells), 10 units each, drawn inside one scale(10) group so
every coordinate below is a whole pixel. Fills are tone colours from art/palette/afterglow-dusk.toml only; nothing is
antialiased, so rsvg-convert at 36 x 24 gives exactly one tone per pixel. docs/art.md has the rules.

After dark. The sun is the family's: a disc of radius 8.4 half set on the horizon at (18, 16), sampled at pixel centres,
in the five stepped bands of the Afterglow sun from the crown down: gold on rows 8 and 9, amber on 10, orange on 11 and
12, peach on 13, coral on 14 and 15. Those tones are Afterglow's ramps, which Desk loads at 256 colours (docs/PALETTE.md
slots 16 to 96 at Desk 4a021a7). Everything around the disc comes from Desk's 16-colour set: orange is slot 8, umber 9,
soot 10, rose 11, slate 5; the Void, slot 0, is the transparent sky. A one-pixel ring of Void separates the disc from
Desk's stepped halo, three one-pixel rings in orange, umber and soot, the border Desk's focused window wears; each ring is
the shape grown by one pixel in all eight directions. The rose horizon runs from x 1 to 34 on row 16; under it, Desk's
stepped Horizon as three flat bands of two rows each, orange, umber and soot from the top, instead of a gradient. Two
slate stars, as in Desk's hero. At 16 terminal colours amber and peach become orange, so the disc is a gold crown, an
orange body and a coral foot, while umber shows slate and soot drops out, so the halo and the Horizon fade from orange to
grey to nothing.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" shape-rendering="crispEdges">
<title>desk</title>
<g transform="scale(10)">
<path id="star" fill="#7c8796" d="M4 3h1v1h-1ZM31 5h1v1h-1Z"/>
<g id="sun">
<path id="gold" fill="#ffd08e" d="M14 8h8v1h-8ZM13 9h10v1h-10Z"/>
<path id="amber" fill="#ffbd67" d="M12 10h12v1h-12Z"/>
<path id="orange" fill="#ffaa40" d="M11 11h14v1h-14ZM10 12h16v1h-16Z"/>
<path id="peach" fill="#fca073" d="M10 13h16v1h-16Z"/>
<path id="coral" fill="#f995a6" d="M10 14h16v2h-16Z"/>
</g>
<g id="halo">
<path id="ring-1" fill="#ffaa40" d="M12 6h12v1h-12ZM11 7h2v1h-2ZM23 7h2v1h-2ZM10 8h2v1h-2ZM24 8h2v1h-2ZM9 9h2v1h-2ZM25 9h2v1h-2ZM8 10h2v1h-2ZM26 10h2v1h-2ZM8 11h1v5h-1ZM27 11h1v5h-1Z"/>
<path id="ring-2" fill="#7d5422" d="M11 5h14v1h-14ZM10 6h2v1h-2ZM24 6h2v1h-2ZM9 7h2v1h-2ZM25 7h2v1h-2ZM8 8h2v1h-2ZM26 8h2v1h-2ZM7 9h2v1h-2ZM27 9h2v1h-2ZM7 10h1v6h-1ZM28 10h1v6h-1Z"/>
<path id="ring-3" fill="#372612" d="M10 4h16v1h-16ZM9 5h2v1h-2ZM25 5h2v1h-2ZM8 6h2v1h-2ZM26 6h2v1h-2ZM7 7h2v1h-2ZM27 7h2v1h-2ZM6 8h2v1h-2ZM28 8h2v1h-2ZM6 9h1v7h-1ZM29 9h1v7h-1Z"/>
</g>
<path id="horizon" fill="#f43f5e" d="M1 16h34v1h-34Z"/>
<g id="stepped-horizon">
<path id="band-top" fill="#ffaa40" d="M1 17h34v2h-34Z"/>
<path id="band-middle" fill="#7d5422" d="M1 19h34v2h-34Z"/>
<path id="band-bottom" fill="#372612" d="M1 21h34v2h-34Z"/>
</g>
</g>
</svg>
