<?xml version="1.0" encoding="UTF-8"?>
<!--
linux logo master: the Afterglow sun set onto a shell-prompt horizon under a few stars, for Linux

(c) Copyright 2026 Liminal HQ, Scott Morris
SPDX-License-Identifier: Apache-2.0 OR MIT

Grid: 36 x 24 logo pixels (36 columns x 12 rows of half-block cells), 10 units each, drawn inside one scale(10) group so
every coordinate below is a whole pixel. Fills are tone colours from art/palette/afterglow-dusk.toml only; nothing is
antialiased, so rsvg-convert at 36 x 24 gives exactly one tone per pixel. docs/art.md has the rules.

Night. A disc of radius 11 centred below the horizon at (18, 23), so only its upper third shows: gold on rows 12 to 14,
orange on 15 to 17. The horizon is a shell prompt: a rose chevron at the left, five pixels with its tip on row 18, then
the rose line from x 5 to 29, then a cream block cursor filling one whole cell (x 31, rows 18 and 19), as a terminal draws it.
Above, a violet night sky as four stars: lilac, violet, violet and one cream.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" shape-rendering="crispEdges">
<title>linux</title>
<g transform="scale(10)">
<g id="sky">
<path id="lilac" fill="#e4b8f8" d="M6 4h1v1h-1Z"/>
<path id="violet" fill="#c98be6" d="M29 2h1v1h-1ZM11 9h1v1h-1Z"/>
</g>
<g id="sun">
<path id="gold" fill="#ffd08e" d="M15 12h6v1h-6ZM12 13h12v1h-12ZM11 14h14v1h-14Z"/>
<path id="orange" fill="#ffaa40" d="M10 15h16v1h-16ZM9 16h18v1h-18ZM8 17h20v1h-20Z"/>
</g>
<g id="prompt">
<path id="horizon" fill="#f43f5e" d="M1 16h1v1h-1ZM2 17h1v1h-1ZM3 18h1v1h-1ZM5 18h25v1h-25ZM2 19h1v1h-1ZM1 20h1v1h-1Z"/>
<path id="cursor" fill="#fff7ea" d="M25 8h1v1h-1ZM31 18h1v2h-1Z"/>
</g>
</g>
</svg>
