# Placeholder pipeline: one job per check, so the checks list names exactly what passed or failed.
# `make check` is the full local gate. The full matrix (cross builds, smokes, size and structure
# checks) lands in its own pull request (docs/handover.md).
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  headers:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check SPDX headers
        run: bash scripts/check-headers.sh

  banner:
    name: Hero banner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils librsvg2-bin fonts-dejavu-core fonts-liberation

      # The runner image ships Google Chrome, which the text-fit pass drives headless.
      - name: Check the banner
        env:
          BANNER_REQUIRE_RENDER: '1'
        run: bash scripts/check-banner.sh

  # Rust: one job per check in the shared ci-rust image, pinned by digest. No apt-get on the
  # runner; every tool comes from the image.

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: afterfetch

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: afterfetch

      - name: Run the tests
        run: cargo nextest run --workspace --locked --no-tests=pass

  deny:
    name: Licences and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The image does not carry cargo-deny: take a pinned release binary and check its digest.
      - name: Install cargo-deny
        env:
          DENY_VERSION: '0.22.1'
          DENY_SHA256: '13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d'
        run: |
          archive="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$archive"
          echo "$DENY_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/deny"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/deny" --strip-components=1
          install -m 0755 "$RUNNER_TEMP/deny/cargo-deny" /usr/local/bin/cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

  # macOS: the one place the program runs on macOS (AF-D5, AF-D56). Both builds come from the Linux-style flags in `platforms/unix/build.sh`
  # (lld against the hand-written `libSystem.tbd`, no SDK), are structure-checked, and run on the runner: arm64 natively and x86_64
  # under Rosetta 2. No secrets are used.
  macos:
    name: macOS build and run
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          echo "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin" >> "$GITHUB_PATH"

      - name: Build and check both architectures
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            bash platforms/unix/build.sh "$target"
            bash platforms/unix/check.sh "$target"
          done

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Run the binaries
        run: bash scripts/smoke/macos.sh

      - name: Build the same bytes twice
        run: bash scripts/repro-unix.sh aarch64-apple-darwin x86_64-apple-darwin
