<?xml version="1.0" encoding="UTF-8"?>
<!--
	Afterfetch hero banner: a terminal window running afterfetch, the Afterglow sun half set beside the facts.

	(c) Copyright 2026 Liminal HQ, Scott Morris
	SPDX-License-Identifier: Apache-2.0 OR MIT

	Scene: the sun from art/masters/afterglow.svg (same stepped bands and rose horizon, colours from
	art/palette/afterglow-dusk.toml) sinks two pixels in whole-pixel steps behind its horizon and rises again,
	and the prompt's cursor blinks. Keep the 1200 x 320 viewBox, SMIL only, the .motion and .static pairs for
	reduced motion, data-loop on the root and animations whose dur divides it. Check every change with
	scripts/check-banner.sh and its shots option, and look at the frames.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title hero-desc" data-loop="8">
	<title id="hero-title">Afterfetch</title>
	<desc id="hero-desc">Afterfetch: A tiny system-information command with an Afterglow sun for every system, from DOS to macOS. A Liminal HQ Labs experiment. An animated banner shows a terminal window running afterfetch: a stepped Afterglow sun sinking behind a rose horizon line beside a list of system facts, with a blinking cursor.</desc>

	<style>
		.ui { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Adwaita Sans', Inter, sans-serif; }
		.mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
		.bg-a { stop-color: #0a1230; }
		.bg-b { stop-color: #131c44; }
		.edge { fill: none; stroke: #28356b; }
		.static { display: none; }
		@media (prefers-color-scheme: dark) {
			.bg-a { stop-color: #060a1c; }
			.bg-b { stop-color: #0d1432; }
			.edge { stroke: #1d2750; }
		}
		@media (prefers-reduced-motion: reduce) {
			.motion { display: none; }
			.static { display: inline; }
		}
	</style>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop class="bg-a" offset="0"/>
			<stop class="bg-b" offset="1"/>
		</linearGradient>
		<linearGradient id="afterglow" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.55" stop-color="#ffaa40"/>
			<stop offset="1" stop-color="#f43f5e"/>
		</linearGradient>
		<radialGradient id="wash">
			<stop offset="0" stop-color="#f43f5e" stop-opacity="0.18"/>
			<stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
		</radialGradient>
		<clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
		<g id="sun-art">
			<path fill="#ffd08e" d="M15 6H21V7H24V8H25V9H11V8H12V7H15Z"/>
			<path fill="#ffbd67" d="M10 9H26V10H27V11H9V10H10Z"/>
			<path fill="#ffaa40" d="M8 11H28V12H29V13H7V12H8Z"/>
			<path fill="#fca073" d="M7 13H29V15H7Z"/>
			<path fill="#f995a6" d="M6 15H30V18H6Z"/>
		</g>
		<clipPath id="sky"><rect x="0" y="0" width="36" height="18"/></clipPath>
	</defs>

	<g clip-path="url(#frame)">
		<rect data-bg="" width="1200" height="320" fill="url(#bg)"/>
		<circle cx="940" cy="330" r="300" fill="url(#wash)"/>

		<!-- Left: title, description, status chip -->
		<!-- hero-text:start (system font; outline it for the final wordmark) -->
		<text class="ui" x="56" y="128" font-size="60" font-weight="800" letter-spacing="-1" fill="url(#afterglow)">Afterfetch</text>
		<!-- hero-text:end -->
		<text class="ui" x="56" y="168" font-size="18" font-weight="500" fill="#e0e0e0">A tiny system-information command</text>
		<text class="ui" x="56" y="192" font-size="18" font-weight="500" fill="#e0e0e0">with an Afterglow sun for every system,</text>
		<text class="ui" x="56" y="216" font-size="18" font-weight="500" fill="#e0e0e0">from DOS to macOS</text>
		<g class="ui" font-size="13" font-weight="600" fill="#b4bfce">
			<rect id="chip-status" data-box="" x="56" y="238" width="134" height="28" rx="14" fill="#a3e635" fill-opacity="0.08" stroke="#a3e635" stroke-opacity="0.45"/>
			<circle class="motion" cx="74" cy="252" r="4" fill="#a3e635">
				<animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" values="1;0.35;1"/>
			</circle>
			<circle class="static" cx="74" cy="252" r="4" fill="#a3e635"/>
			<text data-for="chip-status" x="86" y="257">experimental</text>
		</g>
		<text class="mono" x="56" y="298" font-size="12" fill="#8a96aa">Liminal HQ Labs</text>

		<!-- Right: a terminal window running afterfetch -->
		<g>
			<rect x="646" y="40" width="500" height="240" rx="12" fill="#0a1230" stroke="#3a4888" stroke-opacity="0.8"/>
			<path d="M646 52Q646 40 658 40H1134Q1146 40 1146 52V76H646Z" fill="#17235a"/>
			<text class="ui" x="896" y="63" font-size="12" font-weight="700" fill="#e9e2d8" text-anchor="middle">afterfetch</text>
			<circle cx="1122" cy="58" r="9" fill="#ffffff" fill-opacity="0.1"/>
			<path d="M1118 54L1126 62M1126 54L1118 62" stroke="#e9e2d8" stroke-width="1.6" stroke-linecap="round"/>

			<g transform="translate(668 100) scale(5)" shape-rendering="crispEdges">
				<g clip-path="url(#sky)">
					<g class="motion">
						<g>
							<animateTransform attributeName="transform" type="translate" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.4;0.6;0.8" values="0 0;0 1;0 2;0 1;0 0"/>
							<use href="#sun-art"/>
						</g>
					</g>
					<use class="static" href="#sun-art"/>
				</g>
				<path fill="#f43f5e" d="M1 18H35V19H1Z"/>
			</g>

			<g class="mono" font-size="12.5">
				<text x="870" y="112" fill="#ffd08e" font-weight="700">guest@dusk</text>
				<rect x="870" y="119" width="130" height="2" fill="#f43f5e"/>
				<text x="870" y="142" fill="#ffaa40">OS</text><text x="920" y="142" fill="#e9e2d8">ReactOS 0.4</text>
				<text x="870" y="162" fill="#ffaa40">Arch</text><text x="920" y="162" fill="#e9e2d8">x86 (Pentium)</text>
				<text x="870" y="182" fill="#ffaa40">Memory</text><text x="920" y="182" fill="#e9e2d8">96 MiB</text>
				<text x="870" y="202" fill="#ffaa40">Shell</text><text x="920" y="202" fill="#e9e2d8">cmd</text>
			</g>
			<g>
				<rect x="870" y="216" width="18" height="12" fill="#ffd08e"/><rect x="888" y="216" width="18" height="12" fill="#ffaa40"/><rect x="906" y="216" width="18" height="12" fill="#f995a6"/><rect x="924" y="216" width="18" height="12" fill="#f43f5e"/><rect x="942" y="216" width="18" height="12" fill="#a9b8ff"/><rect x="960" y="216" width="18" height="12" fill="#c98be6"/>
			</g>
			<text class="mono" x="668" y="256" font-size="12.5" fill="#86cf9a">$</text>
			<g class="motion">
				<rect x="684" y="245" width="8" height="14" fill="#e9e2d8">
					<animate attributeName="opacity" calcMode="discrete" dur="2s" repeatCount="indefinite" keyTimes="0;0.45;0.9" values="1;0;1"/>
				</rect>
			</g>
			<rect class="static" x="684" y="245" width="8" height="14" fill="#e9e2d8"/>
		</g>
	</g>
	<rect class="edge" x="0.5" y="0.5" width="1199" height="319" rx="18"/>
</svg>
